version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/student-result-predictor
file_exists_behavior: OVERWRITE
permissions:
  - object: /home/ubuntu/student-result-predictor
    pattern: "**"
    owner: ubuntu
    group: ubuntu
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 900
      runas: root
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 120
      runas: root
